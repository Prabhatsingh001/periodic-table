<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Sync theme class before first paint to avoid flash-of-wrong-theme
      (function(){var t=localStorage.getItem('periodic-theme');if(t==='light')document.documentElement.classList.remove('dark');})();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Periodic Table — Interactive Chemistry Atlas</title>
    <meta name="description" content="A beautiful, interactive periodic table of elements with discovery timeline and detailed element properties." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="font-['Inter',system-ui,sans-serif] antialiased [&::-webkit-scrollbar]:w-1.5 [&::-webkit-scrollbar-track]:bg-transparent [&::-webkit-scrollbar-thumb]:bg-amber-600/20 [&::-webkit-scrollbar-thumb]:rounded-full hover:[&::-webkit-scrollbar-thumb]:bg-amber-600/35">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
